<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>著作閲覧ビューア</title>
  <!-- 和文とポリトニック・ギリシャ文字が美しく調和するフォントを読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Noto Serif", "Gentium Plus", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      line-height: 1.95;
      max-width: 740px;
      margin: 2.2rem auto;
      padding: 0 1.4rem;
      color: #222;
      background-color: #fafafa;
      font-feature-settings: "kern" 1;
    }
    h1.work-title {
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
      line-height: 1.45;
      font-weight: 700;
    }
    hr.section-divider {
      border: none;
      border-top: 1px solid #bbb;
      margin: 1.2rem 0 2rem;
    }
    hr.bottom-divider {
      border: none;
      border-top: 1px solid #bbb;
      margin: 2.6rem 0 1.2rem;
    }
    .aozora-h2 {
      font-size: 1.45rem;
      font-weight: 700;
      margin: 1.8rem 0 0.8rem;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.3rem;
    }
    .aozora-h2-inline {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .aozora-h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 1.4rem 0 0.6rem;
    }
    .aozora-h4 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 1.2rem 0 0.5rem;
    }
    .aozora-h4-inline {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .aozora-bouten {
      text-emphasis: filled dot;
      -webkit-text-emphasis: filled dot;
      text-emphasis-position: over right;
      -webkit-text-emphasis-position: over right;
    }
    .aozora-maru-bouten {
      text-emphasis: open circle;
      -webkit-text-emphasis: open circle;
      text-emphasis-position: over right;
      -webkit-text-emphasis-position: over right;
    }
    .aozora-small {
      font-size: 0.85em;
    }
    .aozora-large {
      font-size: 1.18em;
    }
    .aozora-sup {
      font-size: 0.72em;
      vertical-align: super;
      line-height: 0;
    }
    .aozora-gyoumigi {
      font-size: 0.75em;
      vertical-align: super;
      color: #444;
      margin: 0 0.1em;
    }
    .aozora-italic {
      font-style: italic;
    }
    .aozora-chitsuki {
      text-align: right;
      display: block;
    }
    .aozora-keigakomi {
      border: 1px solid #666;
      background-color: #fff;
      padding: 0.9rem 1.1rem;
      margin: 1.2rem 0;
      border-radius: 3px;
    }
    p.aozora-p {
      margin: 0.45em 0;
      white-space: pre-wrap;
    }
    .aozora-note {
      font-size: 0.85em;
      color: #666;
    }
    .bottom-info {
      font-size: 0.9em;
      color: #444;
      line-height: 1.75;
    }
    .error {
      color: #b00020;
      background: #fdecea;
      padding: 1rem;
      border-radius: 6px;
    }
    ruby rt {
      font-size: 0.55em;
    }
  </style>
</head>
<body>
  <main id="content">読み込み中...</main>

  <script>
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toHalfWidthDigits(str) {
      return str.replace(/[０-９]/g, (d) =>
        String.fromCharCode(d.charCodeAt(0) - 0xfee0)
      );
    }

    function convertAozoraText(rawText) {
      let text = rawText.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

      // 1. 先頭の非空・非注記行をタイトルとして取得
      const lines = text.split("\n");
      let title = "著作閲覧ビューア";
      let titleIndex = -1;

      for (let i = 0; i < lines.length; i++) {
        const trimmed = lines[i].replace(/^[\s\u3000]+|[\s\u3000]+$/g, "");
        if (trimmed !== "" && !trimmed.startsWith("［＃") && !trimmed.startsWith("[#")) {
          title = trimmed;
          titleIndex = i;
          break;
        }
      }

      if (titleIndex !== -1) {
        lines.splice(titleIndex, 1);
      }

      // 2. 末尾の「底本：」以降を分離
      let bottomStartIndex = -1;
      for (let i = lines.length - 1; i >= 0; i--) {
        const t = lines[i].replace(/^[\s\u3000]+/, "");
        if (t.startsWith("底本：") || t.startsWith("底本:")) {
          bottomStartIndex = i;
        } else if (bottomStartIndex !== -1 && t === "") {
          break;
        }
      }

      let bottomLines = [];
      if (bottomStartIndex !== -1) {
        bottomLines = lines.splice(bottomStartIndex);
      }

      text = lines.join("\n");

      const tokens = [];
      const keepToken = (htmlSnippet) => {
        const id = `@@AOZORA_TOKEN_${tokens.length}@@`;
        tokens.push(htmlSnippet);
        return id;
      };
      const restoreTokens = (str) =>
        str.replace(/@@AOZORA_TOKEN_(\d+)@@/g, (_, i) => tokens[Number(i)] ?? "");

      // インライン変換（同一行・同一段落内に複数あってもすべて変換）
      const parseInline = (rawLine) => {
        let s = rawLine;

        // 縦中横の指定・終了タグは横書きでは無視
        s = s.replace(/［＃「[^」]+」は縦中横］/g, "");
        s = s.replace(/［＃縦中横］/g, "");
        s = s.replace(/［＃縦中横終わり］/g, "");

        // ルビ変換（縦線付き → 漢字直後）
        s = s.replace(/｜([^｜\n《》]+)《([^《》\n]+)》/g, (_, base, ruby) =>
          keepToken(`<ruby>${escapeHtml(base)}<rt>${escapeHtml(ruby)}</rt></ruby>`)
        );
        s = s.replace(/([一-龠々ヶ]+)《([^《》\n]+)》/g, (_, kanji, ruby) =>
          keepToken(`<ruby>${escapeHtml(kanji)}<rt>${escapeHtml(ruby)}</rt></ruby>`)
        );

        // 範囲指定のインライン注記
        s = s.replace(/［＃行右小書き］([\s\S]*?)［＃行右小書き終わり］/g, (_, inner) =>
          keepToken(`<span class="aozora-gyoumigi">${parseInline(inner)}</span>`)
        );
        s = s.replace(/［＃小見出し］([\s\S]*?)［＃小見出し終わり］/g, (_, inner) =>
          keepToken(`<span class="aozora-h4-inline">${parseInline(inner)}</span>`)
        );
        s = s.replace(/［＃太字］([\s\S]*?)［＃太字終わり］/g, (_, inner) =>
          keepToken(`<strong>${parseInline(inner)}</strong>`)
        );
        s = s.replace(/［＃斜体］([\s\S]*?)［＃斜体終わり］/g, (_, inner) =>
          keepToken(`<span class="aozora-italic">${parseInline(inner)}</span>`)
        );
        s = s.replace(/［＃[１1]段階小さな文字］([\s\S]*?)［＃小さな文字終わり］/g, (_, inner) =>
          keepToken(`<span class="aozora-small">${parseInline(inner)}</span>`)
        );
        s = s.replace(/［＃[１1]段階大きな文字］([\s\S]*?)［＃大きな文字終わり］/g, (_, inner) =>
          keepToken(`<span class="aozora-large">${parseInline(inner)}</span>`)
        );

        // 直前語句指定の注記（同一行内の複数出現に対応するため、［＃...］の直前語句を個別に置換）
        const replaceEachTarget = (str, suffixPattern, wrapperFn) => {
          const regex = new RegExp(`([^」\\n]+?)${suffixPattern}`, "g");
          return str.replace(regex, (full, candidate, target) => {
            if (candidate.endsWith(target)) {
              const head = candidate.slice(0, candidate.length - target.length);
              return head + keepToken(wrapperFn(escapeHtml(target)));
            }
            return full;
          });
        };

        // 大見出し（後ろに文字が続く場合は改行しないインライン見出しにする）
        s = s.replace(/^(.*?)［＃「([^」]+)」は大見出し］(.*)$/, (_, before, target, after) => {
          let replacedBefore = before;
          if (before.endsWith(target)) {
            const head = before.slice(0, before.length - target.length);
            const hasAfterText = after.replace(/[\s\u3000]+/g, "") !== "";
            const tag = hasAfterText
              ? `<span class="aozora-h2-inline">${escapeHtml(target)}</span>`
              : `<h2 class="aozora-h2">${escapeHtml(target)}</h2>`;
            replacedBefore = head + keepToken(tag);
          }
          return replacedBefore + after;
        });

        // 中見出し・小見出し
        s = replaceEachTarget(s, "［＃「([^」]+)」は中見出し］", (t) => `<h3 class="aozora-h3">${t}</h3>`);
        s = replaceEachTarget(s, "［＃「([^」]+)」は小見出し］", (t) => `<span class="aozora-h4-inline">${t}</span>`);

        // 太字・斜体・上付き小文字・文字サイズ
        s = replaceEachTarget(s, "［＃「([^」]+)」は太字］", (t) => `<strong>${t}</strong>`);
        s = replaceEachTarget(s, "\\[#「([^」]+)」は太字\\]", (t) => `<strong>${t}</strong>`);
        s = replaceEachTarget(s, "［＃「([^」]+)」は斜体］", (t) => `<span class="aozora-italic">${t}</span>`);
        s = replaceEachTarget(s, "［＃「([^」]+)」は上付き小文字］", (t) => `<sup class="aozora-sup">${t}</sup>`);
        s = replaceEachTarget(s, "［＃「([^」]+)」は[１1]段階小さな文字］", (t) => `<span class="aozora-small">${t}</span>`);
        s = replaceEachTarget(s, "［＃「([^」]+)」は[１1]段階大きな文字］", (t) => `<span class="aozora-large">${t}</span>`);
        s = replaceEachTarget(s, "［＃「([^」]+)」は行右小書き］", (t) => `<span class="aozora-gyoumigi">${t}</span>`);

        // 傍点・丸傍点
        s = replaceEachTarget(s, "［＃「([^」]+)」に丸傍点］", (t) => `<span class="aozora-maru-bouten">${t}</span>`);
        s = replaceEachTarget(s, "［＃「([^」]+)」に傍点］", (t) => `<span class="aozora-bouten">${t}</span>`);
        s = replaceEachTarget(s, "\\[#「([^」]+)」に傍点\\]", (t) => `<span class="aozora-bouten">${t}</span>`);

        // 二重山括弧の傍点 《《...》》
        s = s.replace(/《《([^》\n]+)》》/g, (_, boutenText) =>
          keepToken(`<span class="aozora-bouten">${escapeHtml(boutenText)}</span>`)
        );

        // その他の［＃...］注記
        s = s.replace(/［＃([^］]+)］/g, (_, noteContent) =>
          keepToken(`<span class="aozora-note">［＃${escapeHtml(noteContent)}］</span>`)
        );

        return restoreTokens(escapeHtml(s));
      };

      // 3. 行単位でブロック構造（字下げ・折り返し字下げ・地付き・罫囲み・小さな文字）を解析
      const bodyLines = text.split("\n");
      const outputHtml = [];
      let blockIndent = 0;
      let foldIndent = null; // 折り返し字下げの文字数
      let isFirstLineInIndentBlock = false;
      let blockSmall = false;
      let inKeigakomi = false;
      let keigakomiLines = [];

      for (let i = 0; i < bodyLines.length; i++) {
        let line = bodyLines[i].replace(/[\r\n]/g, "");
        const trimmedControl = line.replace(/^[\s\u3000]+|[\s\u3000]+$/g, "");

        // 罫囲みの開始・終了
        if (trimmedControl === "［＃ここから罫囲み］") {
          inKeigakomi = true;
          keigakomiLines = [];
          continue;
        }
        if (trimmedControl === "［＃ここで罫囲み終わり］") {
          inKeigakomi = false;
          const innerHtml = keigakomiLines
            .map((kl) => `<p class="aozora-p">${parseInline(kl)}</p>`)
            .join("\n");
          outputHtml.push(`<div class="aozora-keigakomi">${innerHtml}</div>`);
          keigakomiLines = [];
          continue;
        }
        if (inKeigakomi) {
          if (trimmedControl !== "") {
            keigakomiLines.push(line);
          }
          continue;
        }

        // 字下げ開始（通常字下げ／折り返し字下げ併用）
        const foldIndentMatch = trimmedControl.match(
          /^［＃ここから([０-９0-9]+)字下げ、折り返して([０-９0-9]+)字下げ］$/
        );
        if (foldIndentMatch) {
          blockIndent = parseInt(toHalfWidthDigits(foldIndentMatch[1]), 10) || 0;
          foldIndent = parseInt(toHalfWidthDigits(foldIndentMatch[2]), 10) || 0;
          isFirstLineInIndentBlock = true;
          continue;
        }

        const indentStartMatch = trimmedControl.match(/^［＃ここから([０-９0-9]+)字下げ］$/);
        if (indentStartMatch) {
          blockIndent = parseInt(toHalfWidthDigits(indentStartMatch[1]), 10) || 0;
          foldIndent = null;
          isFirstLineInIndentBlock = true;
          continue;
        }

        if (trimmedControl === "［＃ここで字下げ終わり］") {
          blockIndent = 0;
          foldIndent = null;
          isFirstLineInIndentBlock = false;
          continue;
        }

        if (/^［＃ここから[１1]段階小さな文字］$/.test(trimmedControl)) {
          blockSmall = true;
          continue;
        }
        if (trimmedControl === "［＃ここで小さな文字終わり］") {
          blockSmall = false;
          continue;
        }

        // 空行はスキップ
        if (trimmedControl === "") {
          continue;
        }

        // 行頭のインライン字下げ・地から○字上げ・地付き
        let lineIndent = blockIndent;
        let isChitsuki = false;
        let chitsukiOffset = 0;

        line = line.replace(/［＃([０-９0-9]+)字下げ］/g, (_, numStr) => {
          lineIndent += parseInt(toHalfWidthDigits(numStr), 10) || 0;
          return "";
        });

        const chitsukiAgeMatch = line.match(/［＃地から([０-９0-9]+)字上げ］/);
        if (chitsukiAgeMatch) {
          isChitsuki = true;
          chitsukiOffset = parseInt(toHalfWidthDigits(chitsukiAgeMatch[1]), 10) || 0;
          line = line.replace(/［＃地から[０-９0-9]+字上げ］/g, "");
        }

        if (line.includes("［＃地付き］")) {
          isChitsuki = true;
          line = line.replace(/［＃地付き］/g, "");
        }

        const renderedLine = parseInline(line);

        // ブロック見出し（<h3>など）が単独で生成された場合
        if (/^<h[2-4]\b[^>]*>[\s\S]*<\/h[2-4]>$/.test(renderedLine)) {
          const styleAttr = lineIndent > 0 ? ` style="padding-left: ${lineIndent}em;"` : "";
          outputHtml.push(renderedLine.replace(/^<(h[2-4])/, `<$1${styleAttr}`));
          continue;
        }

        const classes = ["aozora-p"];
        if (blockSmall) classes.push("aozora-small");
        if (isChitsuki) classes.push("aozora-chitsuki");

        const styles = [];
        if (isChitsuki) {
          if (chitsukiOffset > 0) {
            styles.push(`margin-right: ${chitsukiOffset}em;`);
          }
        } else if (foldIndent !== null && blockIndent > 0) {
          // 折り返し字下げ：全体の左余白を折り返し字数にし、1行目だけ差分で左へ戻す
          const diff = blockIndent - foldIndent;
          styles.push(`padding-left: ${foldIndent}em;`);
          styles.push(`text-indent: ${diff}em;`);
          isFirstLineInIndentBlock = false;
        } else if (lineIndent > 0) {
          styles.push(`padding-left: ${lineIndent}em;`);
        }

        const styleAttr = styles.length > 0 ? ` style="${styles.join(" ")}"` : "";
        outputHtml.push(`<p class="${classes.join(" ")}"${styleAttr}>${renderedLine}</p>`);
      }

      const bottomHtml = bottomLines
        .map((l) => l.replace(/[\r\n]/g, ""))
        .filter((l) => l.replace(/^[\s\u3000]+|[\s\u3000]+$/g, "") !== "")
        .map((l) => `<p class="aozora-p">${parseInline(l)}</p>`)
        .join("\n");

      return {
        html: outputHtml.join("\n"),
        bottomHtml,
        title,
      };
    }

    async function loadWork() {
      const contentEl = document.getElementById("content");
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file");

      if (!file) {
        contentEl.innerHTML =
          '<p class="error">表示する作品が指定されていません（URLの末尾に <code>?file=texts/作品名.txt</code> を付けてください）。</p>';
        return;
      }

      if (file.includes("..")) {
        contentEl.innerHTML = '<p class="error">不正なファイル指定です。</p>';
        return;
      }

      try {
        const response = await fetch(file, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("ファイルが見つかりませんでした");
        }
        const rawText = await response.text();
        const result = convertAozoraText(rawText);

        document.title = result.title;

        let fullMarkup = `<h1 class="work-title">${escapeHtml(result.title)}</h1>\n<hr class="section-divider" />\n${result.html}`;
        if (result.bottomHtml) {
          fullMarkup += `\n<hr class="bottom-divider" />\n<section class="bottom-info">${result.bottomHtml}</section>`;
        }

        contentEl.innerHTML = fullMarkup;
      } catch (err) {
        contentEl.innerHTML = `<p class="error">テキストの読み込みに失敗しました: ${escapeHtml(err.message)}</p>`;
      }
    }

    loadWork();
  </script>
</body>
</html>
